name: Controlli di sicurezza

# TruffleHog: segreti in tutto lo storico Git (anche il branch gh-pages pubblicato).
# Trivy: vulnerabilità note nelle dipendenze npm, segreti e configurazioni errate nei file.
# Immagini bloccate per digest (aggiornare insieme a una nuova versione verificata).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"   # ogni lunedì: nuove vulnerabilità pubblicate nel frattempo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Includi il sito pubblicato (gh-pages)
        run: git fetch --no-tags --depth=1 "https://github.com/${{ github.repository }}.git" gh-pages:refs/remotes/origin/gh-pages || true
      - name: TruffleHog – segreti nello storico
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            ghcr.io/trufflesecurity/trufflehog@sha256:8fd07ea46a3f59583c4d50f006d8cf150530141b28969c3c34cc455cb9165a6b \
            git file:///repo --no-update --results=verified,unknown --fail
      - name: Trivy – dipendenze, segreti e configurazioni
        run: |
          docker run --rm -v "$PWD:/repo:ro" -v trivy-cache:/root/.cache \
            ghcr.io/aquasecurity/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            fs --scanners vuln,secret,misconfig --include-dev-deps --skip-dirs /repo/node_modules \
            --severity MEDIUM,HIGH,CRITICAL --exit-code 1 --no-progress /repo
