name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Installa dipendenze e browser
        run: npm ci && npx playwright install --with-deps chromium
      - name: Controllo sintassi
        run: for f in scripts/*.mjs scripts/lib/*.mjs site/*.js tests/*.mjs; do node --check "$f"; done
      - name: Test dell'interfaccia (dati del sito pubblicato)
        run: npm test
