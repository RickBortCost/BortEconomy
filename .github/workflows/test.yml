name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Installa dipendenze e browser
        run: npm ci && npx playwright install --with-deps chromium
      - name: Controllo sintassi
        run: for f in scripts/*.mjs scripts/lib/*.mjs site/*.js tests/*.mjs; do node --check "$f"; done
      - name: Test dell'interfaccia (dati del sito pubblicato)
        run: npm test
