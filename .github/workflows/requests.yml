name: Richieste dal sito

# Si attiva con le issue create dai pulsanti del sito:
#   "Aggiungi titolo: …"  → aggiunge titoli al catalogo monitorato
#   "Avviso prezzo: …"    → crea un avviso di prezzo      "Rimuovi avviso: ID" → lo elimina
# Solo proprietario/collaboratori del repository possono fare richieste.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: add-symbols
  cancel-in-progress: false

jobs:
  add:
    if: startsWith(github.event.issue.title, 'Aggiungi titolo') || startsWith(github.event.issue.title, 'Avviso prezzo') || startsWith(github.event.issue.title, 'Rimuovi avviso')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
      AUTHORIZED: ${{ contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) }}
    steps:
      - name: Richiesta non autorizzata
        if: env.AUTHORIZED != 'true'
        run: |
          gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "Solo i manutentori del repository possono inviare richieste dal sito."
          gh issue close "$ISSUE" -R "$GITHUB_REPOSITORY" --reason "not planned"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: env.AUTHORIZED == 'true'
        with:
          ref: main

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: env.AUTHORIZED == 'true'
        with:
          node-version: 22

      - name: Elabora la richiesta
        if: env.AUTHORIZED == 'true'
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          case "$TITLE" in
            "Aggiungi titolo"*) node scripts/add-symbols.mjs "$TITLE" "$BODY" ;;
            *) node scripts/alerts-request.mjs "$TITLE" ;;
          esac

      - name: Salva le modifiche e ripubblica il sito
        if: env.AUTHORIZED == 'true'
        run: |
          if git diff --quiet site/config.json site/alerts.json; then echo "Nessuna modifica"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/config.json site/alerts.json
          git commit -q -m "Richiesta dal sito: $(cat add-symbols.txt) (#$ISSUE)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          gh workflow run pages.yml -R "$GITHUB_REPOSITORY" --ref main

      - name: Rispondi e chiudi la richiesta
        if: env.AUTHORIZED == 'true'
        run: |
          gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body-file add-result.md
          gh issue close "$ISSUE" -R "$GITHUB_REPOSITORY" --reason completed
