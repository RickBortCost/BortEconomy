name: Aggiungi titoli

# Si attiva con una issue il cui titolo inizia con "Aggiungi titolo" (creata dal pulsante
# "Aggiungi al monitoraggio" del sito). Solo proprietario/collaboratori del repository possono aggiungere titoli.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: add-symbols
  cancel-in-progress: false

jobs:
  add:
    if: startsWith(github.event.issue.title, 'Aggiungi titolo')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
      AUTHORIZED: ${{ contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) }}
    steps:
      - name: Richiesta non autorizzata
        if: env.AUTHORIZED != 'true'
        run: |
          gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "Solo i manutentori del repository possono aggiungere titoli al monitoraggio."
          gh issue close "$ISSUE" -R "$GITHUB_REPOSITORY" --reason "not planned"

      - uses: actions/checkout@v5
        if: env.AUTHORIZED == 'true'
        with:
          ref: main

      - uses: actions/setup-node@v5
        if: env.AUTHORIZED == 'true'
        with:
          node-version: 22

      - name: Risolvi e aggiungi i titoli
        if: env.AUTHORIZED == 'true'
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: node scripts/add-symbols.mjs "$TITLE" "$BODY"

      - name: Salva il catalogo e ripubblica il sito
        if: env.AUTHORIZED == 'true'
        run: |
          if git diff --quiet site/config.json; then echo "Nessuna modifica al catalogo"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/config.json
          git commit -q -m "Aggiungi titoli al monitoraggio: $(cat add-symbols.txt) (#$ISSUE)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          gh workflow run pages.yml -R "$GITHUB_REPOSITORY" --ref main

      - name: Rispondi e chiudi la richiesta
        if: env.AUTHORIZED == 'true'
        run: |
          gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body-file add-result.md
          gh issue close "$ISSUE" -R "$GITHUB_REPOSITORY" --reason completed
