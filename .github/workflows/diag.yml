name: Diagnostica fonti dati
on:
  push:
    branches: ["claude/**"]
    paths: [scripts/diag.mjs, .github/workflows/diag.yml]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node scripts/diag.mjs
      - run: |
          curl -s -o /dev/null -w "curl yahoo %{http_code}\n" -A "Mozilla/5.0" "https://query1.finance.yahoo.com/v8/finance/chart/AAPL?range=5d&interval=1d"
