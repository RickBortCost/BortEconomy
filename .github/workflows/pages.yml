name: Aggiorna dati e pubblica su GitHub Pages

# Pubblica il sito sul branch gh-pages (Pages: "Deploy from a branch" → gh-pages / root).
# Il branch contiene un solo commit, sostituito a ogni esecuzione.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17,47 * * * *"   # ogni 30 minuti
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Scarica news e quotazioni
        run: node scripts/fetch-data.mjs
      - name: Pubblica su gh-pages
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Pubblicazione ${GITHUB_SHA::7} ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
