name: Aggiorna dati e pubblica su GitHub Pages

# Pubblica il sito sul branch gh-pages (Pages: "Deploy from a branch" → gh-pages / root).
# Il branch contiene un solo commit, sostituito a ogni esecuzione.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */2 * * *"   # riserva: il timer principale (ogni 30 minuti) è il Worker Cloudflare workers/scheduler
  workflow_dispatch:
    inputs:
      brief:
        description: "Rigenera subito il punto del giorno"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

# Un'esecuzione in corso non viene interrotta: quella nuova attende (le richieste in attesa più vecchie decadono)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Installa dipendenze
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Scarica news e quotazioni
        run: node scripts/fetch-data.mjs
      - name: Il punto del giorno (Claude)
        continue-on-error: true
        run: node scripts/brief.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEF_FORCE: ${{ inputs.brief && '1' || '' }}
      # Ai rilasci (push su main) l'interfaccia viene verificata con i dati appena scaricati prima di pubblicare
      - name: Installa Playwright
        if: github.event_name == 'push'
        run: npx playwright install --with-deps chromium
      - name: Test dell'interfaccia
        if: github.event_name == 'push'
        run: node tests/smoke.mjs
      - name: Pubblica su gh-pages
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Pubblicazione ${GITHUB_SHA::7} ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
      # Non sulle esecuzioni annullate (es. sostituite da una più recente): non sono un guasto dei dati
      - name: Avvisa se i dati sono degradati
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/health-alert.mjs
      - name: Notifica avvisi di prezzo e salva il loro stato
        if: success() && hashFiles('site/data/alerts-fired.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(cat site/data/alerts-fired.json)" = "[]" ]; then echo "Nessun avviso scattato"; exit 0; fi
          node scripts/alerts-notify.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/alerts.json
          git commit -q -m "Avvisi di prezzo scattati" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
